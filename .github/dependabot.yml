# Dependency updates and security fixes. Security fixes open on their own (repo setting: Dependabot
# security updates); these weekly version updates are grouped into one pull request per ecosystem.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # major versions (Expo SDK, React Native) are upgraded by hand, together
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # React and React Native versions are set by the Expo SDK: they move with it, never on their own
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "react-native"
    groups:
      # Expo and the native packages it pins: CI fails if they drift from what Expo expects;
      # fix with `npx expo install --fix` in apps/mobile
      expo:
        patterns: ["expo", "expo-*", "@expo/*", "react-native-*", "@react-native-async-storage/*"]
        update-types: [minor, patch]
      dependencies:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
